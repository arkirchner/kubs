name: OpenTofu checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Validate with locked providers
        run: |
          nix develop --command bash -euc '
            tofu fmt -check -recursive tofu
            for root in tofu tofu/environments/{local,production}{,/addons}; do
              tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
              tofu -chdir="$root" validate
            done
          '
